version:      0.0.1
name:         astrapi-admin
display_name: Admin

# Schild -- passt zur Policy-Durchsetzungs-/Absicherungsrolle des Servers
# (siehe [[E-003]]), fuer Favicon + PWA-Manifest (astrapi-core >= 26.9.3).
icon_svg: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z'/></svg>"

# Der periodische Anteil laeuft auf den Agenten (systemd-Timer pro Host),
# nicht serverseitig -- Scheduler-Modul wird (noch) nicht gebraucht, kein
# APScheduler als Abhaengigkeit noetig.
disabled_modules:
  - scheduler

# Passkey-Login-Pflicht fuer die UI (siehe astrapi-core system/auth.py,
# Hintergrund [[E-003]]) -- ohne das koennte jeder im LAN eine Policy
# anlegen, die auf jedem gepaarten Host als root ausgefuehrt wird.
# rp_id/rp_name sind nur Startwerte, spaeter ueber die Settings-Seite
# aenderbar, sobald der echte Deployment-Hostname feststeht.
# /api/agent bleibt ausgenommen -- das ist die eigene Bearer-Token-API der
# Agenten, keine Browser-Session.
# password_fallback: false -- Passwort-Login war nur eine Uebergangsloesung
# bis HTTPS steht (siehe Docstring in astrapi_core/system/auth.py). Seit
# dem echten Produktiv-Deployment hinter Caddy/HTTPS (2026-09-02) ist
# Passkey immer nutzbar, das Passwort als schwaecherer, phishbarer Weg
# entfaellt bewusst.
auth:
  enabled: true
  rp_id: admin.simpsons.lan
  rp_name: astrapi-admin
  password_fallback: false
  exempt_prefixes:
    - /api/agent
