label:       Hosts
nav_group:   Admin
nav_default: true

card_actions:
  - type: reconnect
    url: /ui/hosts/{item}/reconnect
  - title: Update anstoßen
    icon: refresh
    hx_get: /ui/hosts/{item}/trigger-update
    hx_target: body
    hx_swap: beforeend
  - title: Nutzer anzeigen
    icon: users
    hx_get: /ui/hosts/{item}/user-inventory
    hx_target: body
    hx_swap: beforeend
  - type: log
