fields:
  - type: section
    label: astrapi-mirror
    cols: 1

  - key: mirror_base_url
    label: Basis-URL
    type: text
    description: "Für die Mirror-Quellen-Auswahl am Host, z.B. https://mirror.simpsons.lan"
    mono: true
    default: "https://mirror.simpsons.lan"

  - type: section
    label: Proxmox
    cols: 1

  - key: proxmox_base_url
    label: Proxmox-URL
    type: text
    description: "Für Snapshot vor Update (E-009), z.B. https://pve.simpsons.lan:8006 -- leer lassen zum Deaktivieren"
    mono: true
    default: ""

  - key: proxmox_token_id
    label: API-Token-ID
    type: text
    description: "Format <benutzer>@<realm>!<tokenname>, z.B. root@pam!astrapi-admin"
    mono: true
    default: ""

  - key: proxmox_token_secret
    label: API-Token-Secret
    type: password
    description: "Leer lassen, um ein bereits gesetztes Secret zu behalten"

  - type: section
    label: Agent
    cols: 1

  - key: agent_poll_interval_minutes
    label: Abfrageintervall (Minuten)
    type: number
    min: 1
    max: 1440
    default: 15
    description: >
      Wie oft gekoppelte Agenten beim Server nach neuer Policy fragen.
      Wirkt erst beim nächsten Poll-Zyklus des jeweiligen Agenten --
      kein Sofort-Push. Braucht mindestens astrapi-admin-agent v26.8.10
      (ältere Agenten ignorieren das Feld einfach).

  - key: agent_timezone
    label: Zeitzone
    type: text
    mono: true
    default: ""
    description: >
      IANA-Zeitzonenname (z.B. Europe/Berlin), der auf allen gekoppelten
      Hosts gesetzt wird (timedatectl set-timezone). Gilt für die ganze
      Flotte, kein Feld pro Host/Gruppe. Leer lassen, um die Zeitzone
      unangetastet zu lassen -- wirkt erst beim nächsten Poll-Zyklus des
      jeweiligen Agenten, kein Sofort-Push. Braucht mindestens
      astrapi-admin-agent v26.9.7 (ältere Agenten ignorieren das Feld
      einfach).

  - type: section
    label: Nutzer-Anzeige
    cols: 1

  - key: hidden_system_usernames
    label: Standardmäßig ausgeblendete Kontonamen
    type: tags
    mono: true
    default:
      - daemon
      - bin
      - sys
      - sync
      - games
      - man
      - lp
      - mail
      - news
      - uucp
      - proxy
      - www-data
      - backup
      - list
      - irc
      - _apt
      - nobody
      - messagebus
      - sshd
      - "systemd-*"
    description: >
      Diese Kontonamen (Glob-Muster wie systemd-* erlaubt) werden im
      "Nutzer anzeigen"-Dialog standardmäßig ausgeblendet -- reine
      Anzeigefilterung, die Bestandsaufnahme selbst bleibt immer
      vollständig gespeichert und ist über "Alle anzeigen" im Dialog
      jederzeit einsehbar. Leere Liste zeigt von Anfang an alle Konten.
