fields:
  - name: hostname
    type: text
    label: Hostname
    placeholder: "z.B. mirror.simpsons.lan"
    max: 120
    column: 1
    row: 1
    colspan: 2

  - name: os_type
    type: info
    label: Betriebssystem
    column: 1
    row: 2

  - name: group_ids
    type: multiselect
    label: Gruppen
    options_endpoint: /api/host_groups/for-select
    column: 1
    row: 3
    colspan: 2

  - name: policy_ids
    type: multiselect
    label: Policies (direkt zugewiesen)
    options_endpoint: /api/policies/for-select?context=host
    column: 1
    row: 4
    colspan: 2

  - name: user_policy_ids
    type: multiselect
    label: Nutzer-Policies (direkt zugewiesen)
    options_endpoint: /api/user_policies/for-select
    column: 1
    row: 5
    colspan: 2

  - name: mirror_repos
    type: multiselect
    label: Mirror-Quellen (Debian)
    options_endpoint: /api/hosts/mirror-repos-for-select
    column: 1
    row: 6
    colspan: 2

  - name: snapshot_before_update
    type: boolean
    label: "Snapshot vor Update erstellen (nur bei erkanntem Proxmox-LXC)"
    default: true
    column: 1
    row: 7

  - name: enabled
    type: boolean
    label: Aktiviert
    default: true
    column: 1
    row: 8
