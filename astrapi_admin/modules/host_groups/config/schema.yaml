fields:
  - name: name
    type: text
    label: Name
    placeholder: "z.B. LXCs"
    max: 80
    column: 1
    row: 1

  - name: description
    type: text
    label: Beschreibung
    placeholder: "z.B. alle Proxmox-LXC-Container"
    max: 200
    column: 1
    row: 2
    colspan: 2

  - name: policy_ids
    type: multiselect
    label: Policies
    options_endpoint: /api/policies/for-select
    column: 1
    row: 3
    colspan: 2
